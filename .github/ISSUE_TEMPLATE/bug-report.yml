name: Bug Report
description: Report a problem with the Adjustable Bed integration
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the form below to help us diagnose and fix the issue.

        **Before submitting:**
        - Check the [Troubleshooting Guide](https://github.com/kristofferR/ha-adjustable-bed/blob/main/docs/TROUBLESHOOTING.md) for common solutions
        - Read the [Getting Help Guide](https://github.com/kristofferR/ha-adjustable-bed/blob/main/docs/GETTING_HELP.md) for how to gather diagnostics
        - Search [existing issues](https://github.com/kristofferR/ha-adjustable-bed/issues) to avoid duplicates

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: What happened and what did you expect to happen?
      placeholder: |
        When I try to move the head of the bed up, nothing happens.
        Expected: The head of the bed should move up when I press the button.
    validations:
      required: true

  - type: input
    id: app_or_remote
    attributes:
      label: App or remote
      description: Which app or remote did you choose when you set up the bed?
      placeholder: "e.g., Linak Bed Control app, Richmat remote, Ergomotion app"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: "The exact version, shown under Settings > Devices & services > Adjustable Bed, including any beta suffix."
      placeholder: "e.g., 5.0.0b9 or 4.4.2"
    validations:
      required: true

  - type: dropdown
    id: connection_method
    attributes:
      label: Bluetooth Connection Method
      description: How is your Home Assistant connected to the bed?
      options:
        - Built-in Bluetooth adapter
        - USB Bluetooth adapter
        - ESPHome Bluetooth Proxy
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Support Bundle
      description: |
        **A support bundle helps us investigate.** If capture fails, describe the error instead so the report can still be tracked.

        1. Go to Developer Tools > Actions
        2. Search for `adjustable_bed.generate_support_bundle`
        3. Select your bed device (the affected Left/Right child for a two-address combined bed) and click "Perform action"
        4. Click the **download link** in the notification that appears
        5. Open the file and remove anything you do not want to share
        6. Drag and drop the JSON file here

        **Alternative:** Under Settings > Devices & services > Adjustable Bed, choose Download diagnostics in the entry's three-dots menu

        **Issues are public.** Open the file in a text editor first and remove anything you do not want to share. The file leaves out PINs, typed names, health readings and other nearby devices, and keeps only the manufacturer prefix of Bluetooth addresses. See [what the files share](https://github.com/kristofferR/ha-adjustable-bed/blob/main/docs/GETTING_HELP.md#what-the-files-share).
      placeholder: "Attach the bundle or diagnostics, or explain why capture was not possible"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional Logs
      description: |
        The support bundle already includes recent logs. Only add extra logs here if you have **debug logging** output that captures the specific issue:
        1. Under Settings > Devices & services > Adjustable Bed, choose Enable debug logging in the three-dots menu
        2. Reproduce the issue
        3. Disable debug logging (browser downloads the log file)
        4. The download is Home Assistant's whole log and is not redacted: paste only the Adjustable Bed and Bluetooth entries, without anything you do not want to share
      render: text
      placeholder: "Paste debug log entries here (optional: the support bundle already includes logs)"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context about the problem here:
        - Home Assistant version, and the integration version you upgraded from if this started after an update
        - Standalone or combined bed; affected side and action target
        - Does the physical remote work?
        - Did this work before? What changed?
        - Any error messages in the UI?
        - Screenshots of the issue?
      placeholder: "The physical remote still works fine..."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm you've done the following
      options:
        - label: I have checked the [Troubleshooting Guide](https://github.com/kristofferR/ha-adjustable-bed/blob/main/docs/TROUBLESHOOTING.md)
          required: true
        - label: I have read the [Getting Help Guide](https://github.com/kristofferR/ha-adjustable-bed/blob/main/docs/GETTING_HELP.md) for how to gather diagnostics
          required: true
        - label: I have searched for [existing issues](https://github.com/kristofferR/ha-adjustable-bed/issues)
          required: true
        - label: I have attached diagnostics or explained why capture was not possible
          required: true

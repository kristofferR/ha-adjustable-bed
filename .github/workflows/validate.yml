name: Validate

# A pull request runs once through pull_request; push covers only main,
# so a same-repo PR branch is not validated twice.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Ruff check
        run: uvx ruff@0.15.16 check custom_components tests

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies and HA-managed Bluetooth stack
        run: |
          uv sync --extra dev
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      - name: Pyright
        run: uvx pyright@1.1.411 custom_components tests scripts
      - name: Bluetooth matchers match the discovery hints
        run: uv run --no-sync python scripts/generate_bluetooth_matchers.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/adjustable_bed/frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check and build
        run: bun run check
      - name: Run tests
        run: bun test
      - name: Verify committed bundle
        run: git diff --exit-code -- dist/adjustable-bed-card.js

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies and HA-managed Bluetooth stack
        run: |
          uv sync --extra dev
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      # Scheduled and manual runs also record each shard's test durations
      # (see the durations job). Splitting reads .test_durations first.
      - name: Run tests (shard ${{ matrix.group }}/3)
        env:
          GROUP: ${{ matrix.group }}
          STORE_DURATIONS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          args=(-q --splits 3 --group "$GROUP"
            --deselect tests/test_wire_snapshot.py::test_wire_bytes_match_committed_snapshot)
          if [ "$STORE_DURATIONS" = true ]; then
            cp .test_durations "durations-$GROUP.json"
            args+=(--store-durations --clean-durations --durations-path "durations-$GROUP.json")
          fi
          uv run --no-sync pytest "${args[@]}"
      - name: Upload shard durations
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-${{ matrix.group }}
          path: durations-${{ matrix.group }}.json
          retention-days: 7

  # The wire guard launches two hash-seed captures. Give them their own runner
  # instead of competing with the shard's other pytest workers.
  wire-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies and HA-managed Bluetooth stack
        run: |
          uv sync --extra dev
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      - name: Verify wire bytes and both hash seeds
        run: >-
          uv run --no-sync pytest -n 0
          tests/test_wire_snapshot.py::test_wire_bytes_match_committed_snapshot

  # pytest-split balances the shards on .test_durations. Refresh it only from
  # this job: download the test-durations artifact of a scheduled or manually
  # dispatched run and commit it on its own. Durations recorded locally, on a
  # loaded machine, skew the shards. Schedules run only on the default branch;
  # for another branch dispatch it: gh workflow run validate.yml --ref <branch>
  durations:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: durations-*
          merge-multiple: true
      - name: Merge shard durations
        run: python3 .github/scripts/merge_test_durations.py durations-*.json > .test_durations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true
          retention-days: 30

  minimum-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install exact minimum HA and matching test helper
        run: |
          uv sync --extra dev
          uv pip install 'homeassistant==2026.11.0' 'pytest-homeassistant[bluetooth] @ https://github.com/home-assistant/core/archive/refs/tags/2026.11.0.tar.gz#subdirectory=packages/pytest-homeassistant'
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      - name: Pyright against minimum HA
        run: uvx pyright@1.1.411 custom_components tests scripts
      - name: Validate minimum registry, flow, Bluetooth, and service APIs
        run: >-
          uv run --no-sync pytest -q
          tests/test_adapter.py tests/test_bluetooth_modernization.py
          tests/test_bluetooth_transport.py tests/test_bluetooth_freshness.py tests/test_coordinator.py
          tests/test_config_flow.py tests/test_init.py
          tests/test_paired_devices.py tests/test_paired_registry.py tests/test_paired_setup.py
          tests/test_diagnostics.py tests/test_support_privacy.py tests/test_support_bundle.py

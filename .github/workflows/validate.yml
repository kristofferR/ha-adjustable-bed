name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Ruff check
        run: uvx ruff@0.15.16 check custom_components tests

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies and HA-managed Bluetooth stack
        run: |
          uv sync --extra dev
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      - name: Pyright
        run: uvx pyright@1.1.411 custom_components tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/adjustable_bed/frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check and build
        run: bun run check
      - name: Run tests
        run: bun test
      - name: Verify committed bundle
        run: git diff --exit-code -- dist/adjustable-bed-card.js

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies and HA-managed Bluetooth stack
        run: |
          uv sync --extra dev
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      - name: Run tests (shard ${{ matrix.group }}/3)
        run: uv run --no-sync pytest -q --splits 3 --group ${{ matrix.group }}

  minimum-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install exact minimum HA and matching test helper
        run: |
          uv sync --extra dev
          uv pip install 'homeassistant==2026.9.0' 'pytest-homeassistant-custom-component==0.13.363'
          uv run --no-sync python scripts/ha_bluetooth_test_requirements.py > /tmp/ha-bluetooth-requirements.txt
          uv pip install -r /tmp/ha-bluetooth-requirements.txt
      - name: Pyright against minimum HA
        run: uvx pyright@1.1.411 custom_components tests
      - name: Validate minimum registry, flow, Bluetooth, and service APIs
        run: >-
          uv run --no-sync pytest -q
          tests/test_adapter.py tests/test_bluetooth_modernization.py
          tests/test_bluetooth_transport.py tests/test_bluetooth_freshness.py tests/test_coordinator.py
          tests/test_config_flow.py tests/test_init.py
          tests/test_paired_devices.py tests/test_paired_registry.py tests/test_paired_setup.py
          tests/test_diagnostics.py tests/test_support_report_logs.py tests/test_support_bundle.py

goto_preset:
  name: Go to Preset
  description: Move bed to a saved memory position.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    preset:
      name: Preset Number
      description: Memory slot number (1-6, device-dependent).
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target the whole bed (or the specific side when you target one side's device); single beds always control the whole bed.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

save_preset:
  name: Save to Preset
  description: Save current bed position to a memory slot.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    preset:
      name: Preset Number
      description: Memory slot number (1-6, device-dependent).
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target the whole bed (or the specific side when you target one side's device); single beds always control the whole bed.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

stop_all:
  name: Stop All Motors
  description: Immediately stop all bed motors.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    side:
      name: Side
      description: Which side of a paired bed to stop. Leave unset to stop the whole bed (or the specific side when you target one side's device); single beds always stop the whole bed.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

set_position:
  name: Set Motor Position
  description: Move a motor to a specific position and stop when reached. Only works for beds with position feedback (Linak, Okimat, Reverie, Keeson, Ergomotion, BOX25 Star).
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    motor:
      name: Motor
      description: The motor to move.
      required: true
      selector:
        select:
          options:
            - label: Back
              value: back
            - label: Legs
              value: legs
            - label: Head
              value: head
            - label: Feet
              value: feet
            - label: Lumbar
              value: lumbar
    position:
      name: Position
      description: Target position (0-68° for back/head, 0-45° for legs/feet, 0-100% for Keeson/Ergomotion/BOX25 Star).
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target both sides (or the specific side when you target one side's device); single beds use their whole-bed target.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

set_positions:
  name: Set Multiple Motor Positions
  description: Move several motors to validated target positions in one ordered request. Every target is validated before movement starts.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    positions:
      name: Positions
      description: One target per motor.
      required: true
      example:
        - motor: back
          position: 30
        - motor: legs
          position: 15
      selector:
        object:
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target both sides (or the specific side when you target one side's device); single beds use their whole-bed target.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

timed_move:
  name: Timed Move
  description: Move a motor for a specified duration. Useful for beds without presets or position feedback.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    motor:
      name: Motor
      description: The motor to move.
      required: true
      selector:
        select:
          options:
            - label: TV Lift
              value: tv_lift
            - label: Back
              value: back
            - label: Legs
              value: legs
            - label: Head
              value: head
            - label: Feet
              value: feet
            - label: Tilt
              value: tilt
            - label: Lumbar
              value: lumbar
            - label: Bed Height
              value: bed_height
            - label: Stair
              value: stair
    direction:
      name: Direction
      description: Direction to move the motor.
      required: true
      selector:
        select:
          options:
            - label: Up
              value: up
            - label: Down
              value: down
    duration_ms:
      name: Duration (ms)
      description: How long to move the motor in milliseconds (100-30000).
      required: true
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: ms
          mode: box
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target both sides (or the specific side when you target one side's device); single beds use their whole-bed target.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

linak_move_simultaneously:
  name: Move Two Linak Sections
  description: Move two different sections with one native Linak Bed Control command, then send STOP.
  fields:
    device_id:
      name: Device
      description: A Linak Bed Control device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    first_motor:
      name: First Motor
      required: true
      selector:
        select:
          options: [base, feet, head, legs, back]
    first_direction:
      name: First Direction
      required: true
      selector:
        select:
          options: [up, down]
    second_motor:
      name: Second Motor
      required: true
      selector:
        select:
          options: [base, feet, head, legs, back]
    second_direction:
      name: Second Direction
      required: true
      selector:
        select:
          options: [up, down]
    duration_ms:
      name: Duration
      description: How long to hold the combined movement before STOP.
      required: true
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: ms
          mode: box
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

linak_rename:
  name: Rename Linak Controller
  description: Write a 1 to 17 byte BLE name, then disconnect so the controller can advertise the new name.
  fields:
    device_id:
      name: Device
      description: A Linak Bed Control device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    name:
      name: Name
      description: New BLE name, limited to 17 UTF-8 bytes.
      required: true
      selector:
        text:
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

linak_set_alarm:
  name: Set Linak Alarm
  description: Program a Bed Control alarm with up to four actions, recurrence, and commit.
  fields:
    device_id:
      name: Device
      description: An alarm-capable Linak Bed Control device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    seconds:
      name: Seconds
      description: Seconds until the alarm. Zero disables the timer.
      required: true
      selector:
        number:
          min: 0
          max: 131071
          mode: box
    actions:
      name: Actions
      description: One to four objects with action, lifetime, and pause fields.
      required: true
      example:
        - action: memory_1
          lifetime: 1
          pause: 0
      selector:
        object:
    recurrence_count:
      name: Recurrence Count
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 31
          mode: box
    recurrence_minutes:
      name: Recurrence Minutes
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 2047
          mode: box
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

solace_audio:
  name: Control Solace audio
  description: Select or preview MotionFlex music, query volume, or set volume.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    action:
      name: Action
      required: true
      selector:
        select:
          options: [select, preview, query, set_volume]
    track:
      name: Track
      description: Required for select and preview actions.
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: box
    volume:
      name: Volume
      description: Required for the set_volume action.
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

solace_set_alarm:
  name: Set Solace alarm
  description: Program the MotionFlex alarm time, recurrence, action, massage, and sound.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    time:
      name: Time
      selector:
        time:
    weekdays:
      name: Weekdays
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    mode:
      name: Bed action
      selector:
        select:
          options: [zero_g, memory_1, no_action]
    massage:
      name: Massage
      selector:
        boolean:
    sound:
      name: Sound
      selector:
        select:
          options: [none, alarm, music_1, music_2, music_3, music_4, music_5]
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

malouf_set_alarm:
  name: Set Malouf/Lucid clock alarm
  description: Replace the stored alarm and synchronize the controller clock, or clear the alarm when disabled.
  fields:
    device_id:
      name: Device
      description: A Malouf/Lucid app controller using an alarm-capable Okin transport.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    enabled:
      name: Enabled
      description: Turn off to clear the stored alarm without supplying time or preset.
      required: true
      selector:
        boolean:
    time:
      name: Time
      description: Required when enabled. Local alarm time in whole minutes, with seconds set to zero.
      selector:
        time:
    weekdays:
      name: Weekdays
      description: Repeat on selected weekdays. Leave empty for the next occurrence of the selected time.
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    preset:
      name: Alarm preset
      description: Required when enabled. These native alarm actions include restored app alarms and are independent of the model's ordinary preset and memory buttons.
      selector:
        select:
          options: [zero_g, lounge, tv, anti_snore, memory_1, memory_2, massage, flat]
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

malouf_app_action:
  name: Run Malouf/Lucid app action
  description: Apply the app's explicit side routing to a supported action. Manual actions use the configured movement pulse count and always release afterward.
  fields:
    device_id:
      name: Device
      description: Select a standalone Malouf/Lucid app device or the paired parent device. Child device targets are not accepted.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    route:
      name: Routing
      default: standard
      selector:
        select:
          options:
            - label: Standard
              value: standard
            - label: Split-head dual base
              value: split_head_dual
            - label: Split-head native side selection
              value: split_head_native
    active_side:
      name: Active side
      description: App side selection. Split-head dual routing also copies shared foot and stop actions to the inactive base. In native routing, Both or None selects the secondary native side once.
      default: both
      selector:
        select:
          options: [left, right, both, none]
    motor_swapped:
      name: Swap native sides
      description: Swap the app's left/right native motor selector. Available only for native split-head routing.
      default: false
      selector:
        boolean:
    action:
      name: Action
      description: Supported app action for every routed destination. Presets affect both bases in split-head dual routing; memory saves affect only the active side.
      required: true
      selector:
        select:
          options:
            - label: All sections down
              value: allDown
            - label: Flat
              value: allFlat
            - label: All sections up
              value: allUp
            - label: Anti-snore
              value: antiSnore
            - label: Head and foot down
              value: dualDown
            - label: Head and foot up
              value: dualUp
            - label: Foot down
              value: footDown
            - label: Foot up
              value: footUp
            - label: Full tilt down
              value: fullTiltDown
            - label: Full tilt up
              value: fullTiltUp
            - label: Head down
              value: headDown
            - label: Head tilt down
              value: headTiltDown
            - label: Head tilt up
              value: headTiltUp
            - label: Head up
              value: headUp
            - label: Toggle under-bed light
              value: lightSwitch
            - label: Lounge
              value: lounge
            - label: Lumbar down
              value: lumbarDown
            - label: Lumbar up
              value: lumbarUp
            - label: Massage timer 10 minutes
              value: massage10
            - label: Massage timer 20 minutes
              value: massage20
            - label: Massage timer 30 minutes
              value: massage30
            - label: Cycle foot massage
              value: massageFoot
            - label: Cycle head massage
              value: massageHead
            - label: Stop massage
              value: massageOff
            - label: Cycle massage timer
              value: massageTimer
            - label: Cycle massage pattern
              value: massageWave
            - label: Recall memory 1
              value: memory1
            - label: Recall memory 2
              value: memory2
            - label: Read
              value: read
            - label: Save memory 1
              value: setMemory1
            - label: Save memory 2
              value: setMemory2
            - label: Stop movement
              value: stopDriver
            - label: Tilt head down
              value: tiltHeadDown
            - label: Tilt head up
              value: tiltHeadUp
            - label: TV / reading
              value: tvRead
            - label: Zero gravity
              value: zeroG

generate_support_bundle:
  name: Generate Support Bundle
  description: Capture the full adjustable-bed support bundle. This combines BLE diagnostics, pairing evidence, adapter and ESPHome proxy health, GATT details, scanner state, up to 30 ranked nearby Bluetooth devices, command trace, and recent integration logs into one JSON file. Nearby device names and addresses are included.
  fields:
    device_id:
      name: Device
      description: A configured adjustable bed device to capture. Provide exactly one of `device_id` or `target_address`.
      required: false
      selector:
        device:
          integration: adjustable_bed
    target_address:
      name: Target Address
      description: Bluetooth MAC address of an unconfigured device (for example `AA:BB:CC:DD:EE:FF`). Provide exactly one of `device_id` or `target_address`.
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    capture_duration:
      name: Capture Duration
      description: How long to capture notifications in seconds. Operate the physical remote during this time to generate useful traffic.
      required: false
      default: 120
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: seconds
          mode: box
    include_logs:
      name: Include Recent Logs
      description: Include recent Home Assistant log entries related to Bluetooth and this integration.
      required: false
      default: true
      selector:
        boolean:

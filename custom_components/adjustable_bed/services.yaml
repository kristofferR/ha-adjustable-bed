rmcontrol_alarm:
  name: RMControl alarm
  description: Configure a supported RMControl product's countdown or repeating alarm. Query results appear in controller state and diagnostics. Alarm actions use the exact product catalog, not raw command bytes.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
    operation:
      name: Operation
      required: true
      selector:
        select:
          options: [single, cancel_single, repeat, delete, query, sync]
    minutes:
      name: Countdown minutes
      description: Required for single alarms.
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    action:
      name: Product action
      description: Exact alarm action name from the selected product's diagnostics. Required for single and repeating alarms.
      selector:
        text:
    alarm_id:
      name: Alarm slot
      description: Required for repeat and delete. Updating a slot replaces that alarm.
      selector:
        number:
          min: 1
          max: 7
          mode: box
    time:
      name: Local alarm time
      description: Required for repeating alarms. Minute precision.
      selector:
        time:
    weekdays:
      name: Repeat on
      description: Required for repeating alarms.
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    side:
      name: Side
      description: Target side of a paired bed. A standalone bed uses its configured RMControl side.
      selector:
        select:
          options: [left, right, both]

rmcontrol_anti_snore:
  name: RMControl snore intervention
  description: Enable, configure or query supported automatic snore intervention. This is separate from the anti-snore position preset.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
    operation:
      name: Operation
      required: true
      selector:
        select:
          options: [switch, configure, query]
    enabled:
      name: Enabled
      description: Required for switch.
      selector:
        boolean:
    mode:
      name: Configuration mode
      description: Required for configure.
      selector:
        select:
          options: [count, time]
    value:
      name: Intervention value
      description: Required for configure. Uses the selected mode's app value; physical interpretation is hardware unverified.
      selector:
        number:
          min: 0
          max: 255
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [left, right, both]

goto_preset:
  name: Go to Preset
  description: Move bed to a saved memory position.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    preset:
      name: Preset Number
      description: Memory slot number (1-8, device-dependent).
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target the whole bed (or the specific side when you target one side's device); single beds always control the whole bed.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

save_preset:
  name: Save to Preset
  description: Save current bed position to a memory slot.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    preset:
      name: Preset Number
      description: Memory slot number (1-8, device-dependent).
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target the whole bed (or the specific side when you target one side's device); single beds always control the whole bed.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

stop_all:
  name: Stop All Motors
  description: Immediately stop all bed motors.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    side:
      name: Side
      description: Which side of a paired bed to stop. Leave unset to stop the whole bed (or the specific side when you target one side's device); single beds always stop the whole bed.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

set_position:
  name: Set Motor Position
  description: Move a motor to a specific position and stop when reached. Only works for beds with position feedback (Linak, Okimat, Reverie, Keeson, Ergomotion, BOX25 Star).
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    motor:
      name: Motor
      description: The motor to move.
      required: true
      selector:
        select:
          options:
            - label: Back
              value: back
            - label: Legs
              value: legs
            - label: Head
              value: head
            - label: Feet
              value: feet
            - label: Lumbar
              value: lumbar
            - label: Left back (Sleep Number MCR)
              value: left_back
            - label: Right back (Sleep Number MCR)
              value: right_back
            - label: Left legs (Sleep Number MCR)
              value: left_legs
            - label: Right legs (Sleep Number MCR)
              value: right_legs
    position:
      name: Position
      description: Target position (0-68° for back/head, 0-45° for legs/feet, 0-100% for Keeson/Ergomotion/BOX25 Star/Sleep Number MCR).
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target both sides (or the specific side when you target one side's device); single beds use their whole-bed target.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

set_positions:
  name: Set Multiple Motor Positions
  description: Move several motors to validated target positions in one ordered request. Every target is validated before movement starts.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    positions:
      name: Positions
      description: One target per motor. Sleep Number MCR uses left_back, right_back, left_legs, or right_legs with 0-100% targets.
      required: true
      example:
        - motor: back
          position: 30
        - motor: legs
          position: 15
      selector:
        object:
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target both sides (or the specific side when you target one side's device); single beds use their whole-bed target.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

timed_move:
  name: Timed Move
  description: Move a motor for a specified duration. Useful for beds without presets or position feedback.
  fields:
    device_id:
      name: Device
      description: The adjustable bed device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    motor:
      name: Motor
      description: The motor to move.
      required: true
      selector:
        select:
          options:
            - label: TV Lift
              value: tv_lift
            - label: Back
              value: back
            - label: Right Back
              value: right_back
            - label: Legs
              value: legs
            - label: Head
              value: head
            - label: Feet
              value: feet
            - label: Tilt
              value: tilt
            - label: Lumbar
              value: lumbar
            - label: Bed Height
              value: bed_height
            - label: Stair
              value: stair
    direction:
      name: Direction
      description: Direction to move the motor.
      required: true
      selector:
        select:
          options:
            - label: Up
              value: up
            - label: Down
              value: down
    duration_ms:
      name: Duration (ms)
      description: How long to move the motor in milliseconds (100-30000).
      required: true
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: ms
          mode: box
    side:
      name: Side
      description: Which side of a paired bed to target. Leave unset to target both sides (or the specific side when you target one side's device); single beds use their whole-bed target.
      required: false
      selector:
        select:
          options:
            - value: both
              label: Both sides
            - value: left
              label: Left
            - value: right
              label: Right

linak_move_simultaneously:
  name: Move Two Sections Together
  description: Move two different sections with one native command (Linak Bed Control, Jensen JMC400), then send STOP.
  fields:
    device_id:
      name: Device
      description: A Linak Bed Control or Jensen JMC400 device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    first_motor:
      name: First Motor
      required: true
      selector:
        select:
          options: [base, feet, head, legs, back]
    first_direction:
      name: First Direction
      required: true
      selector:
        select:
          options: [up, down]
    second_motor:
      name: Second Motor
      required: true
      selector:
        select:
          options: [base, feet, head, legs, back]
    second_direction:
      name: Second Direction
      required: true
      selector:
        select:
          options: [up, down]
    duration_ms:
      name: Duration
      description: How long to hold the combined movement before STOP.
      required: true
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: ms
          mode: box
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

linak_rename:
  name: Rename Linak Controller
  description: Write a 1 to 17 byte BLE name, then disconnect so the controller can advertise the new name.
  fields:
    device_id:
      name: Device
      description: A Linak Bed Control device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    name:
      name: Name
      description: New BLE name, limited to 17 UTF-8 bytes.
      required: true
      selector:
        text:
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

linak_set_alarm:
  name: Set Linak Alarm
  description: Program a Bed Control alarm with up to four actions, recurrence, and commit.
  fields:
    device_id:
      name: Device
      description: An alarm-capable Linak Bed Control device.
      required: true
      selector:
        device:
          integration: adjustable_bed
    seconds:
      name: Seconds
      description: Seconds until the alarm. Zero disables the timer.
      required: true
      selector:
        number:
          min: 0
          max: 131071
          mode: box
    actions:
      name: Actions
      description: One to four objects with action, lifetime, and pause fields.
      required: true
      example:
        - action: memory_1
          lifetime: 1
          pause: 0
      selector:
        object:
    recurrence_count:
      name: Recurrence Count
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 31
          mode: box
    recurrence_minutes:
      name: Recurrence Minutes
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 2047
          mode: box
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

solace_audio:
  name: Control Solace audio
  description: Select or preview MotionFlex music, query volume, or set volume.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    action:
      name: Action
      required: true
      selector:
        select:
          options: [select, preview, query, set_volume]
    track:
      name: Track
      description: Required for select and preview actions.
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: box
    volume:
      name: Volume
      description: Required for the set_volume action.
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

solace_set_alarm:
  name: Set Solace alarm
  description: Program the MotionFlex or Woosa Sleep alarm time, recurrence, action, massage, and sound. Woosa supports sound off or alarm only.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    time:
      name: Time
      selector:
        time:
    weekdays:
      name: Weekdays
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    mode:
      name: Bed action
      selector:
        select:
          options: [zero_g, memory_1, no_action]
    massage:
      name: Massage
      selector:
        boolean:
    sound:
      name: Sound
      selector:
        select:
          options: [none, alarm, music_1, music_2, music_3, music_4, music_5]
    side:
      name: Side
      required: false
      selector:
        select:
          options: [both, left, right]

leggett_sleep_timer:
  name: Set Leggett sleep timer
  description: Start a delayed preset or cancel the stored sleep timer.
  fields:
    device_id:
      name: Device
      description: A timer-capable Leggett Okin controller with its matching app profile.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    action:
      name: Action
      required: true
      selector:
        select:
          options: [start, cancel]
    minutes:
      name: Delay
      description: Required to start. Prodigy accepts 1 to 1439 minutes; U Series accepts 15, 30, 45, 60, 75, or 90 minutes.
      selector:
        number:
          min: 1
          max: 1439
          step: 1
          unit_of_measurement: minutes
          mode: box
    preset:
      name: Sleep action
      description: Prodigy uses memory slots 1 to 4. U Series uses 0 for flat or 1 to 3 for memory; its third memory is available only through this timer.
      default: 1
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

leggett_alarm_timer:
  name: Set Leggett alarm timer
  description: Start an alarm delay or cancel the stored alarm using the selected app profile.
  fields:
    device_id:
      name: Device
      description: A timer-capable Leggett Okin controller with its matching app profile.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    action:
      name: Action
      required: true
      selector:
        select:
          options: [start, cancel]
    minutes:
      name: Delay
      description: Required to start. Alarm delay in whole minutes, from 1 to 1440.
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: minutes
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

leggett_hold_control:
  name: Hold Leggett control
  description: Hold a supported control for a bounded duration, then send its release sequence.
  fields:
    device_id:
      name: Device
      description: A Leggett Okin controller with its matching app profile.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    control:
      name: Control
      description: Memory 1, memory 2, and store are U Series controls. Other choices are available on all app profiles.
      required: true
      selector:
        select:
          options: [flat, snore, lights_toggle, massage_toggle, massage_wave, massage_head_up, massage_head_down, massage_foot_up, massage_foot_down, memory_1, memory_2, store]
    duration:
      name: Duration
      description: Hold for 0.1 to 60 seconds, in whole milliseconds. These are service interface bounds, not firmware limits.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          unit_of_measurement: seconds
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

malouf_set_alarm:
  name: Set Malouf / Lucid clock alarm
  description: Program or clear an alarm on a compatible Malouf Base or Lucid Base app profile. Programming synchronizes the bed clock to Home Assistant's local time first.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    enabled:
      name: Enabled
      description: Turn off to clear the stored alarm.
      required: true
      selector:
        boolean:
    time:
      name: Local alarm time
      description: Time to the nearest minute, using Home Assistant's configured time zone.
      selector:
        time:
    weekdays:
      name: Repeat on
      description: Leave empty for the next occurrence of the selected time.
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    preset:
      name: Bed preset
      default: zero_g
      selector:
        select:
          options: [zero_g, lounge, tv, anti_snore, memory_1, memory_2]
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

malouf_sync_clock:
  name: Synchronize Malouf / Lucid clock
  description: Set a compatible Malouf Base or Lucid Base app controller's clock to Home Assistant's local time.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

logicdata_set_alarm:
  name: Set Logicdata clock alarm
  description: Configure the controller's recurring alarm with a preset and massage levels.
  fields:
    device_id:
      name: Device
      description: A Logicdata phone app controller using the standard protocol. Tablet and middle-motor controllers do not support clock alarms.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    time:
      name: Time
      description: Alarm time on the controller's local clock, to the nearest minute.
      selector:
        time:
    weekdays:
      name: Weekdays
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    preset:
      name: Bed preset
      default: flat
      selector:
        select:
          options: [flat, zero_g, anti_snore, memory_1, memory_2]
    head_level:
      name: Head massage level
      description: Alarm massage intensity, with 0 for off and 1 to 3 for increasing intensity.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    foot_level:
      name: Foot massage level
      description: Alarm massage intensity, with 0 for off and 1 to 3 for increasing intensity.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

logicdata_rename:
  name: Rename Logicdata controller
  description: Change the Bluetooth name of a compatible Logicdata app controller.
  fields:
    device_id:
      name: Device
      description: A Logicdata app controller that supports device renaming.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    name:
      name: Name
      description: This service accepts 1 to 255 printable ASCII characters as a safe common input range for phone and tablet controllers.
      required: true
      selector:
        text:
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

logicdata_hold_preset:
  name: Hold Logicdata preset recall
  description: Recall a middle-motor flat or memory position with repeated commands for a specified duration, then release.
  fields:
    device_id:
      name: Device
      description: A Logicdata app controller using the middle-motor protocol. Standard controllers do not support held preset recall.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    preset:
      name: Preset
      required: true
      selector:
        select:
          options: [flat, memory_1, memory_2]
    duration:
      name: Duration
      description: Hold for 0.2 to 60 seconds, in whole milliseconds. These are service interface bounds, not firmware limits.
      required: true
      selector:
        number:
          min: 0.2
          max: 60
          step: 0.001
          unit_of_measurement: seconds
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

jiecang_set_alarm:
  name: Set Jiecang clock alarm
  description: Configure the controller's recurring alarm with a preset and massage levels.
  fields:
    device_id:
      name: Device
      description: A Jiecang app controller that supports clock alarms.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    time:
      name: Time
      description: Alarm time on the controller's local clock, to the nearest minute.
      selector:
        time:
    weekdays:
      name: Weekdays
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    preset:
      name: Bed preset
      default: flat
      selector:
        select:
          options: [flat, zero_g, anti_snore, memory_1, memory_2, yoga]
    head_level:
      name: Head massage level
      description: Alarm massage intensity, with 0 for off and 1 to 3 for increasing intensity.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    foot_level:
      name: Foot massage level
      description: Alarm massage intensity, with 0 for off and 1 to 3 for increasing intensity.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

jiecang_wake:
  name: Start Jiecang wake routine
  description: Move to a preset and start the selected wake massage levels immediately.
  fields:
    device_id:
      name: Device
      description: A Jiecang app controller that supports wake routines.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    preset:
      name: Bed preset
      default: flat
      selector:
        select:
          options: [flat, zero_g, anti_snore, memory_1, memory_2]
    head_level:
      name: Head massage level
      description: Wake massage intensity, with 0 for off and 1 to 3 for increasing intensity.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    foot_level:
      name: Foot massage level
      description: Wake massage intensity, with 0 for off and 1 to 3 for increasing intensity.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

jiecang_stop_wake:
  name: Stop Jiecang wake massage
  description: Stop active wake massage without disabling the stored weekly clock alarm.
  fields:
    device_id:
      name: Device
      description: A Jiecang app controller that supports wake routines.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

jiecang_rename:
  name: Rename Jiecang controller
  description: Change the Bluetooth name of a compatible Jiecang app controller.
  fields:
    device_id:
      name: Device
      description: A Jiecang app controller that supports device renaming.
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    name:
      name: Name
      description: New Bluetooth name, using 1 to 20 ASCII letters or digits.
      required: true
      selector:
        text:
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

generate_support_bundle:
  name: Generate Support Bundle
  description: Capture the full adjustable-bed support bundle. This combines BLE diagnostics, pairing evidence, retained setup/pairing logs, adapter and ESPHome proxy health, GATT details, scanner state, up to 30 ranked nearby Bluetooth devices, command trace, and recent integration logs into one JSON file. Nearby device names and addresses are included.
  fields:
    device_id:
      name: Device
      description: A configured adjustable bed device to capture. Provide exactly one of `device_id` or `target_address`.
      required: false
      selector:
        device:
          integration: adjustable_bed
    target_address:
      name: Target Address
      description: Bluetooth MAC address of an unconfigured device (for example `AA:BB:CC:DD:EE:FF`). Provide exactly one of `device_id` or `target_address`.
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    capture_duration:
      name: Capture Duration
      description: How long to capture notifications in seconds. Operate the physical remote during this time to generate useful traffic.
      required: false
      default: 120
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: seconds
          mode: box
    include_logs:
      name: Include Recent Logs
      description: Include recent Home Assistant log entries related to Bluetooth and this integration.
      required: false
      default: true
      selector:
        boolean:


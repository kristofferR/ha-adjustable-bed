    parameters:
      name: Parameters
      description: Command-specific fields. Unknown fields and unsupported values are rejected. A parameter side cannot override the selected physical side.
      selector:
        object:

customatic_hold_memory:
  name: Hold Customatic memory controls
  description: Hold a nonempty combination of the Clarity or Remedy memory-page actions. Program combinations can change stored positions.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    actions:
      name: Actions
      description: Select any combination of flat, zg, anti, program and incline. Jerome's C has no memory page.
      required: true
      selector:
        select:
          multiple: true
          options: [flat, zg, anti, program, incline]
    duration:
      name: Duration
      description: Hold for 0.1 to 60 seconds, in whole milliseconds. The refresh ends without a separate STOP frame.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          unit_of_measurement: seconds
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

customatic_move_simultaneously:
  name: Move Customatic motors together
  description: Move one to three axes with one native mask, then send the movement release frame.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    actions:
      name: Motor directions
      description: A mapping of back, legs and optionally lumbar to up or down. Lumbar requires the Remedy profile. Opposing directions on one motor are rejected.
      required: true
      selector:
        object:
    duration:
      name: Duration
      description: Hold for 0.1 to 60 seconds, in whole milliseconds, then release.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          unit_of_measurement: seconds
          mode: box
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

vmatbasic_hold_control:
  name: Hold V-MAT Basic control
  description: Hold a movement for 0.1 to 60 seconds, then send its movement release. The XT floor action ends its refresh without a release packet. Only movement can target both linked receivers.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
    control:
      name: Control
      required: true
      selector:
        select:
          options:
            - all_up
            - all_down
            - back_up
            - back_down
            - legs_up
            - legs_down
            - floor_hold
    duration:
      name: Duration
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          unit_of_measurement: s
          mode: box
    side:
      name: Side
      selector:
        select:
          options:
            - left
            - right
            - both

vmatbasic_rename:
  name: Rename V-MAT Basic receiver
  description: Rename one selected physical receiver. Accepts at most ten UTF-16 units after Java whitespace trimming and twenty encoded UTF-8 bytes, including an empty name. Saved names change only after a successful write.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
    name:
      name: New name
      required: true
      selector:
        text:
    side:
      name: Side
      selector:
        select:
          options:
            - left
            - right

vibradorm_hold_control:
  name: Hold Caresse / Werkmeister / VMAT control
  description: Hold a control supported by the selected app profile, then send its release command.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    control:
      name: Control
      description: Each target must support this control in its selected app and remote profile.
      required: true
      selector:
        select:
          options: [head_up, head_down, back_up, back_down, legs_up, legs_down, feet_up, feet_down, all_up, all_down, memory_1, memory_2, memory_3, memory_4, memory_5, memory_6, sync]
    duration:
      name: Duration
      description: Hold time in seconds. This host limit does not change the app's refresh interval.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

serenity_hold_control:
  name: Hold Serenity control
  description: Hold one supported Serenity app action, then release it. Save actions can change stored positions.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    control:
      name: Control
      description: Literal action from the Serenity profile's held-control options.
      required: true
      selector:
        select:
          options:
            - head_up
            - head_down
            - foot_up
            - foot_down
            - selector_4_up
            - selector_4_down
            - selector_5_up
            - selector_5_down
            - flat
            - zero_g
            - memory_1
            - tv
            - memory_2
            - save_zero_g
            - save_memory_1
            - save_tv
            - save_memory_2
            - massage_head_cycle
            - massage_foot_cycle
            - massage_mode_cycle
            - massage_timer_cycle
            - massage_toggle
            - light_toggle
            - leisure
            - anti_snore
            - wave_1
            - wave_2
            - wave_3
            - massage_off
            - light_on
            - light_off
    duration:
      name: Duration
      description: Hold time in seconds.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
    side:
      name: Side
      selector:
        select:
          options:
            - both
            - left
            - right

simmons_hold_control:
  name: Hold SIMMONS control
  description: Hold one SIMMONS app control, repeating it every 300 ms, then send its release stops. The app's help says holding Custom Mode for 5 seconds saves the current position; the save on the bed is unverified.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    control:
      name: Control
      description: Zero-gravity, TV and anti-snore exist only on a regular bed; the inclined controls only on an inclined bed.
      required: true
      selector:
        select:
          options:
            - head_up
            - head_down
            - legs_up
            - legs_down
            - flat
            - memory
            - light
            - zero_g
            - tv
            - anti_snore
            - inclined_left
            - inclined_middle
            - inclined_right
    duration:
      name: Duration
      description: Hold time in seconds.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
    side:
      name: Side
      selector:
        select:
          options:
            - both
            - left
            - right

simmons_set_alarm:
  name: Set SIMMONS alarm
  description: Program or turn off alarm 1 or 2 of a SIMMONS app bed. The two enabled alarms cannot share a time or a mode.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    slot:
      name: Alarm
      required: true
      selector:
        select:
          options: ["1", "2"]
    enabled:
      name: Enabled
      description: Turn off to disable this alarm.
      required: true
      selector:
        boolean:
    time:
      name: Local alarm time
      description: Time to the nearest minute, using Home Assistant's configured time zone.
      selector:
        time:
    weekdays:
      name: Repeat on
      description: Leave empty for the next occurrence of the selected time.
      selector:
        select:
          multiple: true
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    mode:
      name: Mode
      description: Required when enabling. Anti-snore is available on a regular bed only.
      selector:
        select:
          options: [custom_mode, flat, anti_snore]
    confirm_custom_mode:
      name: Confirm Custom Mode
      description: Required for Custom Mode. Check the saved back/foot angles first; extreme custom angles can cause injury.
      selector:
        boolean:
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

furnimove_action:
  name: FurniMove handset action
  description: Execute an ordered action row from the selected handset. Find row indexes
    in controller diagnostics. The widget consumer uses the app’s separate fixed timing.
  fields:
    device_id:
      name: Device
      required: true
      selector: &id001
        device:
          integration: adjustable_bed
    side:
      name: Side
      selector: &id002
        select:
          options:
          - left
          - right
          - both
    row_index:
      name: Action row index
      required: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    duration:
      name: Hold duration
      description: Optional seconds for held actions. Other actions use their captured
        row timing.
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          mode: box
          unit_of_measurement: s
    consumer:
      name: Consumer
      default: app
      selector:
        select:
          options:
          - app
          - widget
furnimove_rename:
  name: Rename FurniMove receiver
  description: Rename one receiver using a unique name, with up to 18 UTF-16 units
    after trimming. The original text is sent to the receiver.
  fields:
    device_id:
      name: Device
      required: true
      selector: *id001
    side:
      name: Side
      selector: *id002
    name:
      name: New name
      required: true
      selector:
        text: {}
furnimove_massage_program:
  name: FurniMove massage program
  description: Select program 1, 2, 3 or 4 (Wave) using the handset’s captured massage
    queue.
  fields:
    device_id:
      name: Device
      required: true
      selector: *id001
    side:
      name: Side
      selector: *id002
    program:
      name: Program
      required: true
      selector:
        number:
          min: 1
          max: 4
          mode: box
furnimove_massage_duration:
  name: FurniMove advisory massage duration
  description: Set the local app duration preference. This does not program a hardware
    timer or stop massage when time expires.
  fields:
    device_id:
      name: Device
      required: true
      selector: *id001
    side:
      name: Side
      selector: *id002
    minutes:
      name: Advisory duration
      required: true
      selector:
        select:
          options:
          - value: '10'
            label: 10 minutes
          - value: '15'
            label: 15 minutes
          - value: '20'
            label: 20 minutes
          - value: '30'
            label: 30 minutes
furnimove_move_simultaneously:
  name: Move two FurniMove motors
  description: Hold two supported axes with the app’s combined command and release
    cleanup.
  fields:
    device_id:
      name: Device
      required: true
      selector: *id001
    side:
      name: Side
      selector: *id002
    first_motor:
      name: First motor
      required: true
      selector:
        select:
          options:
          - head
          - back
          - legs
          - feet
    second_motor:
      name: Second motor
      required: true
      selector:
        select:
          options:
          - head
          - back
          - legs
          - feet
    first_direction:
      name: First direction
      required: true
      selector:
        select:
          options:
          - up
          - down
    second_direction:
      name: Second direction
      required: true
      selector:
        select:
          options:
          - up
          - down
    duration_ms:
      name: Duration in milliseconds
      required: true
      selector:
        number:
          min: 1
          max: 60000
          mode: box

starcode_abm5_4_hold_control:
  name: Hold AdjustableM5X4 control
  description: Hold one exact app action. Flat runs 600 ms; save and reset run the six-second local confirmation interval. No device acknowledgement is inferred.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: adjustable_bed
          multiple: true
    control:
      name: Control
      required: true
      selector:
        select:
          options: [head_up, head_down, foot_up, foot_down, union_up, union_down, memory_1, flat, tv, lounge, zero_g, anti_snore, save_memory_1, save_tv, save_lounge, save_zero_g, save_reset, head_strength_up, head_strength_down, foot_strength_up, foot_strength_down, wave_up, wave_down]
    duration:
      name: Duration
      description: Hold duration in seconds for movement, presets and wave controls.
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

fsm_relax_hold_control:
  name: FSM Relax hold control
  description: Hold an app-labelled control, then send the five-frame release. Physical actuator mapping is unverified.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: adjustable_bed
    control:
      required: true
      description: Use a command listed in the selected profile's protocol diagnostics.
      selector:
        text:
    duration:
      required: true
      description: Local gesture duration in seconds, not a physical arrival deadline.
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          unit_of_measurement: s
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]
fsm_relax_recall_memory:
  name: FSM Relax recall local memory
  description: Send saved opaque targets and release after an explicit local hold. Replies cannot prove physical arrival.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: adjustable_bed
    preset:
      required: true
      selector:
        number:
          min: 1
          max: 8
    duration:
      required: true
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.001
          unit_of_measurement: s
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]
fsm_relax_calibrate:
  name: FSM Relax confirmed calibration
  description: Calibrate using the four configured reversal flags. One write attempt; a failed write does not prove that hardware did nothing.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: adjustable_bed
    confirmed:
      required: true
      description: Explicitly confirm calibration before invoking this action.
      selector:
        boolean:
    side:
      name: Side
      selector:
        select:
          options: [both, left, right]

starcode_move_lifts:
  name: Control AdjustableM5X5 lifts
  description: Control up to three independently addressed lifts configured on a main bed. Flat sends main flat before the delayed lift flat action.
  fields:
    device_id:
      name: Main bed
      required: true
      selector:
        device:
          integration: adjustable_bed
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - up
            - down
            - flat
            - stop

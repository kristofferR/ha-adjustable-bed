[project]
name = "ha-adjustable-bed"
version = "5.0.0rc2"
description = "Home Assistant integration for adjustable beds"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.11.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.5",
    "pytest-homeassistant[bluetooth]",
    "pytest-split>=0.10.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "aioesphomeapi>=42.0.0",
]

[tool.uv.sources]
# PyPI lacks pytest-homeassistant 2026.11.0 (home-assistant/core#190470), so build
# it from the release tag. Switch to `pytest-homeassistant[bluetooth]>=2026.11.0`
# from PyPI once it is published.
pytest-homeassistant = { url = "https://github.com/home-assistant/core/archive/refs/tags/2026.11.0.tar.gz", subdirectory = "packages/pytest-homeassistant" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx -n auto --dist loadgroup"
# Fail a hung test, with its stack, long before the CI job's own timeout.
timeout = 300
markers = [
    "integration: marks tests as integration tests (require full HA setup)",
    "real_connect_delays: keep the connection profile's retry and settle delays in tests",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM102", "SIM105", "SIM108"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
stubPath = "typings"  # Mirror HA's runtime Voluptuous/Probatio alias
include = ["custom_components", "tests", "scripts"]
# Pyright's default excludes, plus a uv inline script whose Playwright dependency CI lacks.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "scripts/test_compact_card_browser.py"]
reportIncompatibleVariableOverride = "none"  # HA entities use @property over cached_property
reportUnusedImport = "none"  # Covered by ruff F401; pyright also flags TYPE_CHECKING-only imports

# Tests get relaxed rules (mocks, private-member access, asserts on known state).
# Production code in custom_components/ runs at full standard strictness.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]  # Resolve custom_components imports from the repo root
reportTypedDictNotRequiredAccess = "none"  # Tests assert on known state
reportOptionalMemberAccess = "none"  # Tests use coordinator.controller after setup
reportAttributeAccessIssue = "none"  # Tests access private methods
reportOperatorIssue = "none"  # Tests use "in" on optional strings
reportArgumentType = "none"  # Tests use mock objects for type parameters
reportOptionalOperand = "none"  # Tests use optional remote values that are known set
reportOptionalSubscript = "none"  # Tests index into flow results asserted non-None
